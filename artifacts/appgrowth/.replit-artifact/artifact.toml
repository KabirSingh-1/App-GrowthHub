kind = "web"
previewPath = "/"
title = "AppGrowth Platform"
version = "1.0.0"
id = "artifacts/appgrowth"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23974

[services.development]
run = "pnpm --filter @workspace/appgrowth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/appgrowth", "run", "build" ]
publicDir = "artifacts/appgrowth/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23974"
BASE_PATH = "/"
